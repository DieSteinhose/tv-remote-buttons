# Cloudflare Worker that receives device reports from the app and files them as GitHub issues.
# Deploy:  npx wrangler deploy
# Secret:  npx wrangler secret put GITHUB_TOKEN   (fine-grained token: this repo, Issues read/write)
name = "tv-remote-buttons"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
REPO = "DieSteinhose/tv-remote-buttons"

# At most 5 reports per minute and IP address (the address is not stored)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# One report per TV and IP address per day: stores a SHA-256 hash of (IP, TV model) for 24 hours,
# never the address itself
[[kv_namespaces]]
binding = "SEEN"
id = "56f89fe22d3b4429b7e56439c2c23a24"
